version: 2

# Security-only Dependabot config.
#
# Policy (source of truth: agents-hub vault/Processes/servers-security-deployment.md):
#   - Routine version updates are SUPPRESSED (open-pull-requests-limit: 0).
#     Supply chain is the top attack vector — nothing enters the tree just to
#     stay "current." Do deliberate `npm outdated` sweeps manually when wanted.
#   - Security updates STILL open (they ignore open-pull-requests-limit) and are
#     batched into ONE PR per ecosystem via the `security` group.
#   - High/Critical CVE (CVSS >= 7.0), non-major → auto-merged by ci.yml after CI.
#   - Everything else (low/moderate CVE, CVE-driven majors) → flagged 🚨 by
#     dependabot-security-flag.yml and left for manual review.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 0 # disables routine version PRs; security updates unaffected
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps):"
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - github-actions
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
